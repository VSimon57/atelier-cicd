name: pipeline

# Déclencheurs : quand le pipeline tourne-t-il ?
on:
  push:
    branches: [main]        # chaque commit sur main
  pull_request:
    branches: [main]        # chaque PR qui vise main
  workflow_dispatch:        # bouton "Run workflow" (lancement manuel)

# Moindre privilège : le jeton du pipeline ne peut que lire le code.
permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Lint et tests unitaires
        run: bash ci/lint-test.sh
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7
      - name: Lance build.sh
        run: bash ci/build.sh
      - name: Lance smoke.sh
        run: bash ci/smoke-test.sh
      - name: Téléverser l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: image   
          path: out/image.tar                 
          retention-days: 3
  # Etape 3 
  securite:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/download-artifact@v8
        with :
          name: image
          path: out/image.tar
      - name: Lance sbom.sh
        run: bash ci/sbom.sh
      - name: Téléverser le SBOM
        uses: actions/upload-artifact@v4
        with:
          name: SBOM   
          path: |
            out/sbom.cdx.json
            out/sbom.spdx.json
            out/sbom.spdx.json
            out/sbom.txt
          retention-days: 30
      - name: Lance scan sh
        run: bash ci/scan.sh
      - name: Téléverser l'artefact Vulnerability
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulnerabilites   
          path: out/vulnerabilites.txt               
          retention-days: 3